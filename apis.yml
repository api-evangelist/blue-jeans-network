name: Blue Jeans Network
description: >-
  Blue Jeans Network (later BlueJeans by Verizon) was a cloud-based video
  conferencing company founded in 2009 in Mountain View / San Jose, California.
  It delivered interoperable video meetings across desktop, mobile, and
  conference-room systems, and offered a developer surface that included the
  onVideo/Meetings REST API and a WebRTC Embed SDK for embedding live video into
  applications. Verizon acquired BlueJeans in 2020; Verizon subsequently
  discontinued the BlueJeans service and the bluejeans.com website and developer
  portal are no longer reachable. This profile preserves the company's published
  package artifacts, which persist in public registries even though the hosted
  service is retired. Originally surfaced as a portfolio company of Accel and
  Battery Ventures.
